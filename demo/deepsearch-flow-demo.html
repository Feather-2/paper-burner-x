<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSearch Flow - Premium Integration</title>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.7.4/dist/style.css">
  <style>
    /* Paper Burner X - Premium Design Tokens */
    :root {
      --primary: #4F46E5;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;

      --bg-root: #F3F4F6;
      --text-main: #111827;
      --text-secondary: #4B5563;
      --text-tertiary: #9CA3AF;

      --radius-card: 20px;
      --shadow-float: 0 20px 40px -4px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      outline: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Plus Jakarta Sans", "Inter", -apple-system, sans-serif;
      background: var(--bg-root);
      background-image: radial-gradient(#E5E7EB 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* === Header === */
    .app-header {
      height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      z-index: 50;
      flex-shrink: 0;
      background: rgba(243, 244, 246, 0.8);
      border-bottom: 1px solid rgba(0, 0, 0, 0.03);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 18px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-actions {
      display: flex;
      gap: 20px;
      color: var(--text-tertiary);
      font-size: 20px;
    }

    /* === Layout Body === */
    .layout-body {
      flex: 1;
      display: flex;
      top: 0;
      left: 0;
      /* Align top */
      padding: 0 24px 24px;
      overflow: hidden;
      position: relative;
    }

    /* Main Stage: Unrestricted Layer */
    .main-stage {
      flex: 1;
      display: flex;
      position: relative;
    }

    /* Viz Panel: Full Bleed Canvas */
    .viz-panel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
    }

    #flow-container {
      width: 100%;
      height: 100%;
    }

    /* Controls Overlay */
    .controls-overlay {
      position: absolute;
      bottom: 24px;
      left: 24px;
      display: flex;
      gap: 12px;
      z-index: 5;
    }

    .btn-float {
      height: 48px;
      padding: 0 24px;
      border-radius: 24px;
      border: none;
      background: var(--text-main);
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s;
    }

    .btn-float:hover {
      transform: translateY(-2px);
    }

    /* Right Floating Panel (Process Card) */
    .process-panel {
      position: absolute;
      top: 16px;
      bottom: 24px;
      right: 24px;
      width: 42%;
      max-width: 440px;

      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid white;
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-float);
      z-index: 10;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .panel-status-area {
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: linear-gradient(to bottom, #FFFFFF, #FAFAFA);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .status-icon-badge {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #EFF6FF;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .status-icon-badge.success {
      background: #ECFDF5;
      color: var(--success);
    }

    .status-text-group {
      flex: 1;
    }

    .status-text-group h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .status-text-group p {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .process-content {
      flex: 1;
      overflow-y: auto;
      background: #FFFFFF;
      /* Padding included in step items */
    }

    /* Step Item Styles - High Density */
    .step-item {
      padding: 14px 24px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.03);
      display: flex;
      gap: 14px;
      transition: background 0.2s;
      position: relative;
    }

    .step-item::before {
      content: '';
      position: absolute;
      left: 33px;
      top: 34px;
      bottom: -14px;
      width: 1px;
      background: #E5E7EB;
      z-index: 0;
    }

    .step-item:last-child::before {
      display: none;
    }

    .step-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #F3F4F6;
      color: #9CA3AF;
      border: 2px solid #FFFFFF;
      box-shadow: 0 0 0 1px #E5E7EB;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
      z-index: 1;
      margin-top: 2px;
    }

    .step-item.completed .step-icon {
      background: var(--success);
      color: white;
      box-shadow: none;
      border-color: transparent;
    }

    .step-item.running .step-icon {
      background: var(--primary);
      color: white;
      box-shadow: none;
      border-color: transparent;
      animation: pulse 1.5s infinite;
    }

    .step-item.info .step-icon {
      background: #3B82F6;
      color: white;
    }

    .step-info {
      flex: 1;
    }

    .step-header-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .step-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .step-time {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--text-tertiary);
    }

    .step-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Detailed Metadata Blocks */
    .step-details {
      margin-top: 8px;
      background: #F8FAFC;
      border-radius: 8px;
      padding: 8px 10px;
      border: 1px solid #F1F5F9;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-row {
      font-size: 11px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .detail-label {
      color: #64748B;
      font-weight: 500;
      min-width: 60px;
    }

    .detail-val {
      color: #334155;
      font-family: "JetBrains Mono", monospace;
      flex: 1;
      word-break: break-all;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4);
      }

      70% {
        box-shadow: 0 0 0 6px rgba(79, 70, 229, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(79, 70, 229, 0);
      }
    }

    /* Chat Sidebar */
    .chat-sidebar {
      width: 340px;
      background: #FFFFFF;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      overflow: hidden;
      z-index: 20;
      margin-top: 16px;
      margin-bottom: 24px;
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #F3F4F6;
      font-size: 13px;
      font-weight: 600;
      background: #FAFAFA;
    }

    .chat-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: white;
    }

    .chat-msg {
      margin-bottom: 12px;
      display: flex;
      gap: 10px;
    }

    .chat-avatar {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #F3F4F6;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .chat-bubble {
      background: #F9FAFB;
      padding: 8px 12px;
      border-radius: 0 10px 10px 10px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
      border: 1px solid #F3F4F6;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 2px;
    }
  </style>
</head>

<body>

  <header class="app-header">
    <div class="brand">
      <div class="brand-logo"><iconify-icon icon="solar:box-bold"></iconify-icon></div>
      Paper Burner X
    </div>
    <div class="header-actions">
      <iconify-icon icon="solar:settings-outline"></iconify-icon>
      <iconify-icon icon="solar:user-circle-bold"></iconify-icon>
    </div>
  </header>

  <div class="layout-body">

    <div class="main-stage">
      <!-- Full Canvas -->
      <div class="viz-panel">
        <div id="flow-container"></div>

        <div class="controls-overlay">
          <button class="btn-float" id="btn-start">
            <iconify-icon icon="solar:play-bold"></iconify-icon> Start Analysis
          </button>
          <button class="btn-float" style="background:white; color:#374151;" id="btn-reset">
            <iconify-icon icon="solar:restart-bold"></iconify-icon>
          </button>
        </div>
      </div>

      <!-- Floating Process Panel (High Density) -->
      <div class="process-panel">
        <div class="panel-status-area">
          <div class="status-icon-badge" id="status-badge">
            <iconify-icon icon="solar:magnifer-outline"></iconify-icon>
          </div>
          <div class="status-text-group">
            <h3 id="status-title">System Ready</h3>
            <p id="status-sub">Waiting for research protocol...</p>
          </div>
        </div>

        <div class="process-content" id="process-list"></div>
      </div>
    </div>

    <!-- Chat Sidebar -->
    <div class="chat-sidebar">
      <div class="chat-header">Research Assistant (Active)</div>
      <div class="chat-body" id="chat-body">
        <div class="chat-msg">
          <div class="chat-avatar"><iconify-icon icon="solar:magic-stick-3-bold"></iconify-icon></div>
          <div class="chat-bubble">I am ready. Click 'Start Analysis' to begin the DeepSearch demo.</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initDeepSearchFlow } from '../js/ppt/dashboard/deepsearch-flow-visualizer.js';

    // === High Fidelity Event Stream ===
    const detailedEvents = [
      { name: "deepsearch.started", payload: { runId: "Run_2025_X92" }, text: "Initializing DeepSearch Protocol", details: { "RunID": "Run_2025_X92", "Mode": "Deep/Recursive" } },

      { name: "deepsearch.node.started", payload: { nodeId: "scan_01", stage: "scan" }, text: "Scanning 8 input documents...", details: {} },
      { name: "deepsearch.scan.completed", payload: { sourceCount: 8, plannedSteps: 12 }, text: "Document structure analysis complete.", details: { "Docs": 8, "Pages": 142, "Format": "PDF/DOCX" } },
      { name: "deepsearch.node.completed", payload: { nodeId: "scan_01" }, text: "Scan phase finished.", details: {} },

      { name: "deepsearch.node.started", payload: { nodeId: "gaps_01", stage: "gaps" }, text: "Identifying knowledge gaps...", details: {} },
      { name: "deepsearch.gap.upserted", payload: { gapId: "g1", question: "Gap: Quantum Entanglement Mechanics breakdown?", priority: "high" }, text: "Detected information gap.", details: { "Topic": "Quantum Physics", "Priority": "High" } },
      { name: "deepsearch.gap.upserted", payload: { gapId: "g2", question: "Gap: RSA vs ECC Encryption comparison?", priority: "high" }, text: "Detected comparison ambiguity.", details: { "Topic": "Cryptography", "Priority": "High" } },
      { name: "deepsearch.gaps.completed", payload: { gapCount: 3, totalGaps: 3 }, text: "Gap analysis finalized.", details: { "Total Gaps": 3, "Est. Iterations": 2 } },

      { name: "deepsearch.iteration.started", payload: { iteration: 1, openGapCount: 3 }, text: "Starting Recursion Batch #1", details: { "Batch": 1, "Targets": "3 Gaps" } },

      { name: "deepsearch.node.started", payload: { nodeId: "ret_01", stage: "retrieve" }, text: "Vector retrieval in progress...", details: {} },
      { name: "deepsearch.retrieve.completed", payload: { retrievedCount: 56, retrievedBeforeDedupe: 120 }, text: "Keyword & Vector hybrid search done.", details: { "Raw Hits": 120, "Vector Cosine": ">0.75" } },
      { name: "deepsearch.retrieve.deduped", payload: { before: 120, after: 56 }, text: "Deduplication applied.", details: { "Filtered": 64, "Kept": 56 } },
      { name: "deepsearch.rerank.completed", payload: { inputCount: 56, outputCount: 24 }, text: "Cross-Encoder Reranking complete.", details: { "Model": "BGE-Reranker-v2", "Top-K": 24 } },
      { name: "deepsearch.node.completed", payload: { nodeId: "ret_01" }, text: "Retrieval phase finished.", details: {} },

      { name: "deepsearch.node.started", payload: { nodeId: "und_01", stage: "understand" }, text: "LLM Reasoning & Extraction...", details: {} },
      { name: "deepsearch.claim.snapshot", payload: { claims: [{ claimId: "c1", textPreview: "Shor's algorithm factors integers in polynomial time.", importance: 0.9 }] }, text: "Extracting Key Claims...", details: { "Claim": "Shor's Algorithm impact...", "Confidence": "98%" } },
      { name: "deepsearch.understand.completed", payload: { claimCount: 12, evidenceCount: 18 }, text: "Reasoning complete.", details: { "Claims": 12, "Evidence Links": 18 } },
      { name: "deepsearch.node.completed", payload: { nodeId: "und_01" }, text: "Understanding phase finished.", details: {} },

      { name: "deepsearch.node.started", payload: { nodeId: "ext_01", stage: "external" }, text: "External Web Search initiated.", details: { "Trigger": "Low Confidence Context" } },
      { name: "deepsearch.external.progress", payload: { provider: "Arxiv", query: "Shor Algorithm optimization 2024", resultCount: 5 }, text: "Querying Arxiv API...", details: { "Query": "Shor Algorithm 2024", "Hits": 5 } },
      { name: "deepsearch.external.completed", payload: { chunksCount: 10, documentsCount: 2 }, text: "External context ingested.", details: { "New Chunks": 10 } },

      { name: "deepsearch.iteration.completed", payload: { iteration: 1, hitCount: 15 }, text: "Recursion Batch #1 Finished.", details: { "Hits": 15, "Resolved Gaps": 3 } },

      { name: "deepsearch.node.started", payload: { nodeId: "wri_01", stage: "write" }, text: "Synthesizing Final Report...", details: {} },
      { name: "deepsearch.write.section.started", payload: { sectionTitle: "Introduction to Qubits", sectionIndex: 0, sectionCount: 4 }, text: "Drafting Section 1...", details: { "Section": "Intro to Qubits" } },
      { name: "deepsearch.write.section.completed", payload: { sectionTitle: "Introduction to Qubits" }, text: "Section 1 Finalized.", details: { "Words": 450 } },
      { name: "deepsearch.write.completed", payload: { slideCount: 14, claimCount: 26 }, text: "Full report generation complete.", details: { "Slides": 14, "Citations": 26 } },

      { name: "deepsearch.completed", payload: { slideCount: 14 }, text: "Mission Success.", details: { "Duration": "42s", "Tokens": "12,450" } }
    ];

    let flowViz = null;

    async function init() {
      // LR Direction for horizontal timeline feel
      flowViz = await initDeepSearchFlow('flow-container', { direction: 'LR', height: 600 });

      const processList = document.getElementById('process-list');
      const chatBody = document.getElementById('chat-body');

      const statusTitle = document.getElementById('status-title');
      const statusSub = document.getElementById('status-sub');
      const statusBadge = document.getElementById('status-badge');

      const addStep = (event) => {
        if (!event.text) return;
        const div = document.createElement('div');
        div.className = 'step-item';

        if (event.name.includes("completed") || event.name.includes("upserted")) div.classList.add("completed");
        if (event.name.includes("started") && !event.name.includes("node")) div.classList.add("running");
        if (event.name.includes("external")) div.classList.add("info");

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

        let icon = '<iconify-icon icon="solar:record-circle-outline"></iconify-icon>';
        if (div.classList.contains('completed')) icon = '<iconify-icon icon="solar:check-circle-bold"></iconify-icon>';
        if (div.classList.contains('running')) icon = '<iconify-icon icon="solar:refresh-circle-bold"></iconify-icon>';
        if (div.classList.contains('info')) icon = '<iconify-icon icon="solar:info-circle-bold"></iconify-icon>';

        // Render KV Details
        let detailsHtml = '';
        if (event.details && Object.keys(event.details).length > 0) {
          detailsHtml = `<div class="step-details">
                ${Object.entries(event.details).map(([k, v]) => `
                    <div class="detail-row">
                        <span class="detail-label">${k}:</span>
                        <span class="detail-val">${v}</span>
                    </div>
                `).join('')}
            </div>`;
        }

        div.innerHTML = `
          <div class="step-icon">${icon}</div>
          <div class="step-info">
            <div class="step-header-line">
              <span class="step-name">${event.name.split('.')[1]}</span>
              <span class="step-time">${time}</span>
            </div>
            <div class="step-desc">${event.text}</div>
            ${detailsHtml}
          </div>
        `;
        processList.appendChild(div); // Append to bottom for log feel, or insertBefore for latest up
        // Scroll to bottom
        processList.scrollTop = processList.scrollHeight;
      };

      const addChat = (text) => {
        const div = document.createElement('div');
        div.className = 'chat-msg';
        div.innerHTML = `<div class="chat-avatar"><iconify-icon icon="solar:magic-stick-3-bold"></iconify-icon></div><div class="chat-bubble">${text}</div>`;
        chatBody.appendChild(div);
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      document.getElementById('btn-start').onclick = async () => {
        document.getElementById('btn-start').disabled = true;
        processList.innerHTML = '';
        flowViz.reset();

        statusTitle.textContent = "Processing...";

        for (const event of detailedEvents) {
          flowViz.processEvent(event);
          addStep(event);

          // Integrated Header Updates
          if (event.name.includes("scan")) { statusSub.textContent = "Scanning documents..."; statusBadge.innerHTML = '<iconify-icon icon="solar:scanner-outline"></iconify-icon>'; }
          if (event.name.includes("gaps")) { statusSub.textContent = "Analyzing gaps..."; statusBadge.innerHTML = '<iconify-icon icon="solar:atom-outline"></iconify-icon>'; }
          if (event.name.includes("retrieve")) { statusSub.textContent = "Retrieving context..."; statusBadge.innerHTML = '<iconify-icon icon="solar:magnifer-outline"></iconify-icon>'; }
          if (event.name.includes("write")) { statusSub.textContent = "Drafting report..."; statusBadge.innerHTML = '<iconify-icon icon="solar:pen-new-square-outline"></iconify-icon>'; }

          if (event.name === "deepsearch.completed") {
            statusTitle.textContent = "Analysis Complete";
            statusSub.textContent = "Report ready.";
            statusBadge.innerHTML = '<iconify-icon icon="solar:check-circle-bold"></iconify-icon>';
            statusBadge.classList.add('success');
            addChat("Research finished successfully.");
            document.getElementById('btn-start').disabled = false;
          }

          // Variable delay for realism
          let delay = 600;
          if (event.name.includes("completed")) delay = 300;
          if (event.name.includes("scan")) delay = 1000;
          await new Promise(r => setTimeout(r, delay));
        }
      };

      document.getElementById('btn-reset').onclick = () => location.reload();
    }

    init();
  </script>
</body>

</html>
