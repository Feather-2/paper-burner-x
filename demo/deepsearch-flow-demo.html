<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSearch Flow - 可视化演示</title>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.7.4/dist/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6366f1;
      --primary-light: #818cf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.98);
      --border: #e2e8f0;
      --text: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      min-height: 100vh;
    }

    .main-layout {
      display: flex;
      height: 100vh;
    }

    /* 左侧内容区 */
    .content-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
    }

    /* ReactFlow 区域 - 左侧主要区域 */
    #flow-container {
      flex: 1;
      min-width: 400px;
      height: 100%;
      background: linear-gradient(180deg, #fafbfc 0%, #f1f5f9 100%);
      border-right: 1px solid var(--border);
    }

    /* 流程卡片层 - 右侧 */
    .flow-card-layer {
      width: 480px;
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      padding: 24px;
      overflow-y: auto;
    }

    .flow-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow:
        0 4px 6px -1px rgba(0, 0, 0, 0.05),
        0 10px 15px -3px rgba(0, 0, 0, 0.08),
        0 20px 25px -5px rgba(0, 0, 0, 0.04);
      padding: 24px;
      width: 100%;
    }

    /* 卡片头部 */
    .card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }

    .card-title-group {
      flex: 1;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-subtitle .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.9); }
    }

    .iteration-badge {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      color: #92400e;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    /* 阶段进度 */
    .stage-section {
      margin-bottom: 20px;
    }

    .stage-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .stage-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stage-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      background: #f8fafc;
      transition: all 0.2s ease;
    }

    .stage-item.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(129, 140, 248, 0.05));
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .stage-item.completed {
      background: rgba(34, 197, 94, 0.06);
    }

    .stage-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: white;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .stage-item.active .stage-icon {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .stage-item.completed .stage-icon {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .stage-info {
      flex: 1;
    }

    .stage-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .stage-item.active .stage-name {
      color: var(--primary);
    }

    .stage-metrics {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .stage-status {
      font-size: 10px;
      color: var(--text-muted);
    }

    .stage-item.active .stage-status {
      color: var(--primary);
    }

    .stage-item.completed .stage-status {
      color: var(--success);
    }

    /* 指标网格 */
    .metrics-section {
      margin-bottom: 24px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .metric-card {
      background: linear-gradient(135deg, #f8fafc, #f1f5f9);
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
      border: 1px solid rgba(226, 232, 240, 0.6);
    }

    .metric-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
      margin-bottom: 6px;
    }

    .metric-card.primary .metric-value { color: var(--primary); }
    .metric-card.success .metric-value { color: var(--success); }
    .metric-card.warning .metric-value { color: var(--warning); }

    .metric-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 活动日志 */
    .log-section {
      background: #0f172a;
      border-radius: 14px;
      overflow: hidden;
    }

    .log-header {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
    }

    .log-content {
      padding: 12px 16px;
      max-height: 140px;
      overflow-y: auto;
      font-family: "SF Mono", "Monaco", "Consolas", monospace;
      font-size: 11px;
    }

    .log-item {
      display: flex;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
    }

    .log-item:last-child { border-bottom: none; }

    .log-time {
      color: #475569;
      flex-shrink: 0;
    }

    .log-event {
      color: var(--primary-light);
    }

    .log-detail {
      color: #64748b;
      margin-left: auto;
    }

    /* 右侧 Chatbox - 隐藏 */
    .chatbox-area {
      display: none;
    }

    .chatbox-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chatbox-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .chatbox-placeholder {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      padding: 60px 24px;
      line-height: 1.6;
    }

    .chatbox-input {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }

    .chatbox-input input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .chatbox-input input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    /* 控制按钮 */
    .demo-controls {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 100;
      display: flex;
      gap: 10px;
    }

    .demo-btn {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .demo-btn:hover {
      background: #4f46e5;
      transform: translateY(-1px);
    }

    .demo-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .demo-btn.secondary {
      background: white;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .demo-btn.secondary:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.5);
    }
  </style>
</head>
<body>
  <div class="main-layout">
    <!-- 左侧内容区 -->
    <div class="content-area">
      <!-- ReactFlow 背景层 -->
      <div id="flow-container"></div>

      <!-- 流程卡片层 -->
      <div class="flow-card-layer">
        <div class="flow-card">
          <!-- 头部 -->
          <div class="card-header">
            <div class="card-icon">
              <iconify-icon icon="carbon:ibm-watson-discovery"></iconify-icon>
            </div>
            <div class="card-title-group">
              <div class="card-title">DeepSearch 深度研究</div>
              <div class="card-subtitle">
                <span class="status-dot" id="status-dot"></span>
                <span id="current-stage">等待开始...</span>
              </div>
            </div>
            <div class="iteration-badge" id="iteration-badge" style="display: none;">
              迭代 #1
            </div>
          </div>

          <!-- 阶段进度 -->
          <div class="stage-section">
            <div class="stage-section-title">执行阶段</div>
            <div class="stage-list" id="stage-list">
              <div class="stage-item" data-stage="scan">
                <div class="stage-icon">◎</div>
                <div class="stage-info">
                  <div class="stage-name">文档扫描</div>
                  <div class="stage-metrics" id="scan-metrics">分析文档结构</div>
                </div>
                <div class="stage-status">待执行</div>
              </div>
              <div class="stage-item" data-stage="gaps">
                <div class="stage-icon">◇</div>
                <div class="stage-info">
                  <div class="stage-name">知识缺口识别</div>
                  <div class="stage-metrics" id="gaps-metrics">发现需要补充的信息</div>
                </div>
                <div class="stage-status">待执行</div>
              </div>
              <div class="stage-item" data-stage="retrieve">
                <div class="stage-icon">⟳</div>
                <div class="stage-info">
                  <div class="stage-name">证据检索</div>
                  <div class="stage-metrics" id="retrieve-metrics">搜索相关内容</div>
                </div>
                <div class="stage-status">待执行</div>
              </div>
              <div class="stage-item" data-stage="understand">
                <div class="stage-icon">◈</div>
                <div class="stage-info">
                  <div class="stage-name">内容理解</div>
                  <div class="stage-metrics" id="understand-metrics">提取论点和证据</div>
                </div>
                <div class="stage-status">待执行</div>
              </div>
              <div class="stage-item" data-stage="write">
                <div class="stage-icon">✎</div>
                <div class="stage-info">
                  <div class="stage-name">内容生成</div>
                  <div class="stage-metrics" id="write-metrics">生成演示文稿</div>
                </div>
                <div class="stage-status">待执行</div>
              </div>
            </div>
          </div>

          <!-- 指标 -->
          <div class="metrics-section">
            <div class="stage-section-title">实时指标</div>
            <div class="metrics-grid">
              <div class="metric-card primary">
                <div class="metric-value" id="metric-claims">0</div>
                <div class="metric-label">论点</div>
              </div>
              <div class="metric-card success">
                <div class="metric-value" id="metric-evidence">0</div>
                <div class="metric-label">证据</div>
              </div>
              <div class="metric-card warning">
                <div class="metric-value" id="metric-gaps">0</div>
                <div class="metric-label">缺口</div>
              </div>
              <div class="metric-card">
                <div class="metric-value" id="metric-chunks">0</div>
                <div class="metric-label">片段</div>
              </div>
            </div>
          </div>

          <!-- 日志 -->
          <div class="log-section">
            <div class="log-header">
              <iconify-icon icon="carbon:terminal"></iconify-icon>
              活动日志
            </div>
            <div class="log-content" id="log-area"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧 Chatbox -->
    <div class="chatbox-area">
      <div class="chatbox-header">
        <iconify-icon icon="carbon:chat"></iconify-icon>
        智能问答
      </div>
      <div class="chatbox-messages" id="chat-messages">
        <div class="chatbox-placeholder">
          <iconify-icon icon="carbon:search" style="font-size: 48px; opacity: 0.3; display: block; margin-bottom: 16px;"></iconify-icon>
          DeepSearch 正在深度研究中...<br>
          完成后可基于研究结果提问
        </div>
      </div>
      <div class="chatbox-input">
        <input type="text" placeholder="基于研究结果提问..." disabled>
      </div>
    </div>
  </div>

  <!-- 控制按钮 -->
  <div class="demo-controls">
    <button class="demo-btn" id="btn-run">
      <iconify-icon icon="mdi:play"></iconify-icon>
      开始演示
    </button>
    <button class="demo-btn secondary" id="btn-reset">
      <iconify-icon icon="mdi:refresh"></iconify-icon>
      重置
    </button>
  </div>

  <script type="module">
    import { initDeepSearchFlow } from '../js/ppt/deepsearch-flow-visualizer.js';

    // 模拟事件 - 准确反映 DeepSearch 架构
    // 单轨迹模式: scan → gaps → [iteration: retrieve → understand → (external)?] × N → write → condense
    const mockEvents = [
      { name: "deepsearch.started", payload: { runId: "run_demo_001" } },

      // ===== Scan 阶段 =====
      { name: "deepsearch.node.started", payload: { nodeId: "scan_1", stage: "scan" } },
      { name: "deepsearch.scan.completed", payload: { sourceCount: 8, plannedSteps: 5 } },
      { name: "deepsearch.node.completed", payload: { nodeId: "scan_1" } },

      // ===== Gaps 阶段（初始） =====
      { name: "deepsearch.node.started", payload: { nodeId: "gaps_1", stage: "gaps" } },
      { name: "deepsearch.gap.upserted", payload: { gapId: "g1", question: "量子计算的基本原理是什么？", status: "open", priority: "high" } },
      { name: "deepsearch.gap.upserted", payload: { gapId: "g2", question: "量子比特与经典比特的本质区别？", status: "open", priority: "high" } },
      { name: "deepsearch.gap.upserted", payload: { gapId: "g3", question: "量子纠缠如何实现量子通信？", status: "open", priority: "medium" } },
      { name: "deepsearch.gaps.completed", payload: { gapCount: 3, totalGaps: 3, todoCount: 6 } },
      { name: "deepsearch.node.completed", payload: { nodeId: "gaps_1" } },

      // ===== 迭代 0 =====
      { name: "deepsearch.iteration.started", payload: { iteration: 0, openGapCount: 3 } },

      // Retrieve
      { name: "deepsearch.node.started", payload: { nodeId: "retrieve_0", stage: "retrieve" } },
      { name: "deepsearch.retrieve.deduped", payload: { before: 56, after: 38, duplicateCount: 18 } },
      { name: "deepsearch.rerank.completed", payload: { inputCount: 38, outputCount: 24, duration: 312 } },
      { name: "deepsearch.retrieve.completed", payload: { retrievedCount: 24, retrievedBeforeDedupe: 56 } },
      { name: "deepsearch.node.completed", payload: { nodeId: "retrieve_0" } },

      // Understand
      { name: "deepsearch.node.started", payload: { nodeId: "understand_0", stage: "understand" } },
      { name: "deepsearch.claim.snapshot", payload: {
        claims: [
          { claimId: "c1", textPreview: "量子计算利用量子叠加和纠缠实现并行计算能力" },
          { claimId: "c2", textPreview: "量子比特可同时表示 0 和 1 的叠加态，经典比特只能是确定的 0 或 1" },
        ]
      }},
      { name: "deepsearch.understand.completed", payload: { claimCount: 12, evidenceCount: 18, conflictCount: 1 } },
      { name: "deepsearch.node.completed", payload: { nodeId: "understand_0" } },

      { name: "deepsearch.checkpoint.saved", payload: { checkpointId: "cp_iter0_abc123", iteration: 0 } },
      { name: "iteration.completed", payload: { iteration: 0, hitCount: 15, noNewHitsRounds: 0, openGapCount: 2 } },

      // ===== Gaps 阶段（迭代后更新） =====
      { name: "deepsearch.node.started", payload: { nodeId: "gaps_2", stage: "gaps" } },
      { name: "deepsearch.gap.upserted", payload: { gapId: "g4", question: "Shor 算法如何威胁现有 RSA 加密？", status: "open", priority: "high" } },
      { name: "deepsearch.gaps.completed", payload: { gapCount: 1, totalGaps: 4, todoCount: 2 } },
      { name: "deepsearch.node.completed", payload: { nodeId: "gaps_2" } },

      // ===== 迭代 1 =====
      { name: "deepsearch.iteration.started", payload: { iteration: 1, openGapCount: 2 } },

      // Retrieve
      { name: "deepsearch.node.started", payload: { nodeId: "retrieve_1", stage: "retrieve" } },
      { name: "deepsearch.retrieve.completed", payload: { retrievedCount: 18 } },
      { name: "deepsearch.node.completed", payload: { nodeId: "retrieve_1" } },

      // Understand - 触发外搜
      { name: "deepsearch.node.started", payload: { nodeId: "understand_1", stage: "understand" } },
      { name: "deepsearch.reflect.needsmore", payload: { confidence: 0.68, suggestions: ["补充 Shor 算法数学原理", "加入量子纠错机制"] } },
      { name: "deepsearch.understand.completed", payload: { claimCount: 18, evidenceCount: 26, conflictCount: 0 } },
      { name: "deepsearch.node.completed", payload: { nodeId: "understand_1" } },

      // External Search（条件触发）
      { name: "deepsearch.node.started", payload: { nodeId: "external_1", stage: "external" } },
      { name: "deepsearch.external.started", payload: { providerCount: 2, gapCount: 2, providers: ["arxiv", "semantic_scholar"] } },
      { name: "deepsearch.external.progress", payload: { provider: "arxiv", query: "Shor algorithm RSA factorization", resultCount: 12 } },
      { name: "deepsearch.external.progress", payload: { provider: "semantic_scholar", query: "quantum error correction codes", resultCount: 8 } },
      { name: "deepsearch.external.completed", payload: { chunksCount: 16, documentsCount: 5, evidencesCount: 11 } },
      { name: "deepsearch.node.completed", payload: { nodeId: "external_1" } },

      // 外搜后再次 Understand
      { name: "deepsearch.node.started", payload: { nodeId: "understand_1b", stage: "understand" } },
      { name: "deepsearch.claim.snapshot", payload: {
        claims: [
          { claimId: "c3", textPreview: "Shor 算法可在多项式时间内分解大整数，威胁 RSA 安全性" },
          { claimId: "c4", textPreview: "量子纠错码通过冗余编码保护量子信息免受退相干影响" },
        ]
      }},
      { name: "deepsearch.understand.completed", payload: { claimCount: 26, evidenceCount: 42, conflictCount: 1 } },
      { name: "deepsearch.node.completed", payload: { nodeId: "understand_1b" } },

      { name: "deepsearch.checkpoint.saved", payload: { checkpointId: "cp_iter1_def456", iteration: 1 } },
      { name: "iteration.completed", payload: { iteration: 1, hitCount: 8, noNewHitsRounds: 1, openGapCount: 0 } },

      // ===== Write 阶段 =====
      { name: "deepsearch.node.started", payload: { nodeId: "write_1", stage: "write" } },
      { name: "deepsearch.write.toc.planned", payload: {
        sectionCount: 5,
        maxParallel: 3,
        sections: [
          { sectionId: "s1", title: "量子计算基础：叠加与纠缠" },
          { sectionId: "s2", title: "量子比特 vs 经典比特" },
          { sectionId: "s3", title: "量子算法：从 Shor 到 Grover" },
          { sectionId: "s4", title: "量子通信与量子密码学" },
        ]
      }},
      { name: "deepsearch.write.section.started", payload: { sectionTitle: "量子计算基础：叠加与纠缠", sectionIndex: 0, sectionCount: 5 } },
      { name: "deepsearch.write.section.completed", payload: { sectionTitle: "量子计算基础：叠加与纠缠", sectionIndex: 0, sectionCount: 5 } },
      { name: "deepsearch.write.section.started", payload: { sectionTitle: "量子比特 vs 经典比特", sectionIndex: 1, sectionCount: 5 } },
      { name: "deepsearch.write.section.completed", payload: { sectionTitle: "量子比特 vs 经典比特", sectionIndex: 1, sectionCount: 5 } },
      { name: "deepsearch.write.review.completed", payload: { round: 1, overallScore: 8.6, issueCount: 2, patchCount: 1 } },
      { name: "deepsearch.write.completed", payload: { slideCount: 14, claimCount: 26 } },
      { name: "deepsearch.node.completed", payload: { nodeId: "write_1" } },

      // ===== Condense 阶段 =====
      { name: "deepsearch.node.started", payload: { nodeId: "condense_1", stage: "condense" } },
      { name: "deepsearch.condense.completed", payload: {
        keptChunks: 42,
        summary: "完成量子计算深度研究：从基础原理（叠加、纠缠）到实际应用（Shor算法、量子通信），共提取26个核心论点，生成14页演示文稿。"
      }},
      { name: "deepsearch.node.completed", payload: { nodeId: "condense_1" } },

      { name: "deepsearch.token.usage", payload: { model: "claude-3-opus", inputTokens: 52000, outputTokens: 14000, cost: 0.98 } },
      { name: "deepsearch.completed", payload: { slideCount: 14, claimCount: 26 } },
    ];

    const stageInfo = {
      scan: { name: "文档扫描", runningText: "正在分析文档结构..." },
      gaps: { name: "知识缺口识别", runningText: "正在识别信息缺口..." },
      retrieve: { name: "证据检索", runningText: "正在检索相关内容..." },
      understand: { name: "内容理解", runningText: "正在提取论点和证据..." },
      external: { name: "外部搜索", runningText: "正在搜索外部资源..." },
      write: { name: "内容生成", runningText: "正在生成演示文稿..." },
      condense: { name: "整理压缩", runningText: "正在整理研究成果..." },
      iteration: { name: "迭代", runningText: "正在进行新一轮迭代..." }
    };

    let flowViz = null;
    let running = false;
    let metrics = { claims: 0, evidence: 0, gaps: 0, chunks: 0 };
    let currentIteration = -1;

    function updateStageUI(stage, status, metricsData) {
      const stageItem = document.querySelector(`.stage-item[data-stage="${stage}"]`);
      if (!stageItem) return;

      stageItem.classList.remove('active', 'completed');
      if (status === 'running') {
        stageItem.classList.add('active');
        stageItem.querySelector('.stage-status').textContent = '执行中...';
      } else if (status === 'completed') {
        stageItem.classList.add('completed');
        stageItem.querySelector('.stage-status').textContent = '已完成';
      }

      // 更新阶段指标
      if (metricsData) {
        const metricsEl = stageItem.querySelector('.stage-metrics');
        const parts = [];
        if (metricsData.sourceCount) parts.push(`${metricsData.sourceCount} 个文档`);
        if (metricsData.gapCount !== undefined) parts.push(`${metricsData.gapCount} 个缺口`);
        if (metricsData.retrievedCount) parts.push(`${metricsData.retrievedCount} 个片段`);
        if (metricsData.chunkCount) parts.push(`${metricsData.chunkCount} 个片段`);
        if (metricsData.claimCount) parts.push(`${metricsData.claimCount} 个论点`);
        if (metricsData.evidenceCount) parts.push(`${metricsData.evidenceCount} 个证据`);
        if (metricsData.slideCount) parts.push(`${metricsData.slideCount} 页幻灯片`);
        if (metricsData.chunksCount) parts.push(`${metricsData.chunksCount} 个外部片段`);
        if (metricsData.documentsCount) parts.push(`${metricsData.documentsCount} 个文档`);
        if (metricsData.keptChunks) parts.push(`保留 ${metricsData.keptChunks} 个片段`);
        if (parts.length > 0) {
          metricsEl.textContent = parts.join(' · ');
        }
      }
    }

    function updateGlobalMetrics(payload) {
      if (payload.claimCount !== undefined) {
        metrics.claims = payload.claimCount;
        document.getElementById('metric-claims').textContent = metrics.claims;
      }
      if (payload.evidenceCount !== undefined) {
        metrics.evidence = payload.evidenceCount;
        document.getElementById('metric-evidence').textContent = metrics.evidence;
      }
      if (payload.gapCount !== undefined) {
        metrics.gaps = payload.gapCount;
        document.getElementById('metric-gaps').textContent = metrics.gaps;
      }
      if (payload.openGapCount !== undefined) {
        metrics.gaps = payload.openGapCount;
        document.getElementById('metric-gaps').textContent = metrics.gaps;
      }
      if (payload.chunkCount !== undefined || payload.retrievedCount !== undefined) {
        metrics.chunks = payload.chunkCount || payload.retrievedCount || metrics.chunks;
        document.getElementById('metric-chunks').textContent = metrics.chunks;
      }
    }

    function addLog(event) {
      const logArea = document.getElementById('log-area');
      const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      let detail = '';
      const p = event.payload || {};
      if (p.sourceCount) detail = `${p.sourceCount} 源`;
      else if (p.gapCount !== undefined) detail = `${p.gapCount} 缺口`;
      else if (p.retrievedCount) detail = `${p.retrievedCount} 片段`;
      else if (p.claimCount) detail = `${p.claimCount} 论点`;
      else if (p.slideCount) detail = `${p.slideCount} 页`;
      else if (p.iteration !== undefined) detail = `#${p.iteration + 1}`;

      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = `
        <span class="log-time">${time}</span>
        <span class="log-event">${event.name.replace('deepsearch.', '')}</span>
        ${detail ? `<span class="log-detail">${detail}</span>` : ''}
      `;
      logArea.appendChild(div);
      logArea.scrollTop = logArea.scrollHeight;
    }

    function processEvent(event) {
      const name = event.name;
      const payload = event.payload || {};

      // 更新状态显示
      if (name === 'deepsearch.started') {
        document.getElementById('current-stage').textContent = '正在初始化研究...';
      } else if (name === 'deepsearch.node.started') {
        const stage = payload.stage;
        if (stageInfo[stage]) {
          document.getElementById('current-stage').textContent = stageInfo[stage].runningText;
          updateStageUI(stage, 'running');
        }
      } else if (name === 'deepsearch.node.completed') {
        // 找到对应的阶段
        const nodeId = payload.nodeId;
        const stageMatch = nodeId.match(/^([a-z]+)_/);
        if (stageMatch) {
          updateStageUI(stageMatch[1], 'completed');
        }
      } else if (name === 'deepsearch.iteration.started') {
        currentIteration = payload.iteration;
        const badge = document.getElementById('iteration-badge');
        badge.style.display = 'block';
        badge.textContent = `迭代 #${currentIteration + 1}`;
      } else if (name === 'deepsearch.completed') {
        document.getElementById('current-stage').textContent = '研究完成！';
        document.getElementById('status-dot').style.animation = 'none';
        document.getElementById('status-dot').style.background = '#22c55e';
      }

      // 阶段完成时更新指标
      if (name.includes('.completed') && name !== 'deepsearch.completed' && name !== 'deepsearch.node.completed') {
        const stage = name.split('.')[1];
        updateStageUI(stage, 'completed', payload);
        updateGlobalMetrics(payload);
      }
    }

    async function init() {
      flowViz = await initDeepSearchFlow('flow-container', {
        direction: 'LR',
        height: window.innerHeight
      });

      document.getElementById('btn-run').onclick = async () => {
        if (running) return;
        running = true;
        document.getElementById('btn-run').disabled = true;

        flowViz.reset();
        document.getElementById('log-area').innerHTML = '';
        metrics = { claims: 0, evidence: 0, gaps: 0, chunks: 0 };
        currentIteration = -1;

        // 重置 UI
        document.querySelectorAll('.stage-item').forEach(item => {
          item.classList.remove('active', 'completed');
          item.querySelector('.stage-status').textContent = '待执行';
        });
        document.getElementById('iteration-badge').style.display = 'none';
        document.getElementById('status-dot').style.animation = 'pulse 1.5s infinite';
        document.getElementById('status-dot').style.background = '#6366f1';

        for (const event of mockEvents) {
          flowViz.processEvent(event);
          processEvent(event);
          addLog(event);
          await new Promise(r => setTimeout(r, 350));
        }

        running = false;
        document.getElementById('btn-run').disabled = false;
      };

      document.getElementById('btn-reset').onclick = () => {
        flowViz.reset();
        document.getElementById('log-area').innerHTML = '';
        document.getElementById('current-stage').textContent = '等待开始...';
        document.getElementById('iteration-badge').style.display = 'none';
        document.getElementById('status-dot').style.animation = 'pulse 1.5s infinite';
        document.getElementById('status-dot').style.background = '#6366f1';

        document.querySelectorAll('.stage-item').forEach(item => {
          item.classList.remove('active', 'completed');
          item.querySelector('.stage-status').textContent = '待执行';
        });

        metrics = { claims: 0, evidence: 0, gaps: 0, chunks: 0 };
        document.getElementById('metric-claims').textContent = '0';
        document.getElementById('metric-evidence').textContent = '0';
        document.getElementById('metric-gaps').textContent = '0';
        document.getElementById('metric-chunks').textContent = '0';
      };
    }

    init().catch(console.error);
  </script>
</body>
</html>
