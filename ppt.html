<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto PPT - Paper Burner X</title>
    <link rel="icon" type="image/svg+xml" href="public/pure.svg">

    <!-- CDN 预连接 -->
    <link rel="dns-prefetch" href="https://gcore.jsdelivr.net">
    <link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin>

    <!-- Vditor WYSIWYG Markdown Editor -->
    <link rel="stylesheet" href="https://gcore.jsdelivr.net/npm/vditor@3.10.7/dist/index.css" />
    <script src="https://gcore.jsdelivr.net/npm/vditor@3.10.7/dist/index.min.js"></script>

    <!-- Tailwind CSS & 核心依赖 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://gcore.jsdelivr.net/npm/iconify-icon@2.0.0/dist/iconify-icon.min.js"></script>
    <script src="https://gcore.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://gcore.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://gcore.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <!-- Document Parsing (DOCX/HTML) -->
    <script src="https://gcore.jsdelivr.net/npm/mammoth@1.4.21/mammoth.browser.min.js"></script>
    <script src="https://gcore.jsdelivr.net/npm/turndown@7.1.2/dist/turndown.min.js"></script>

    <!-- PptxGenJS -->
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://gcore.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://gcore.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Marked -->
    <script src="https://gcore.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- html2canvas (用于截图) -->
    <script src="https://gcore.jsdelivr.net/npm/html2canvas-pro@1.5.13/dist/html2canvas-pro.min.js"></script>

    <!-- React Flow (DeepSearch/Design 流程可视化) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.7.4/dist/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- PPT 样式模块 -->
    <link rel="stylesheet" href="css/ppt/ppt_generation_variables.css">
    <link rel="stylesheet" href="css/ppt/ppt_generation_layout.css">
    <link rel="stylesheet" href="css/ppt/ppt_generation_components.css">
    <link rel="stylesheet" href="css/ppt/ppt_generation_chat.css">
    <link rel="stylesheet" href="css/ppt/ppt_generation_presentation.css">
    <link rel="stylesheet" href="css/ppt/ppt_generation.css">
    <link rel="stylesheet" href="css/slide-editor.css">
    <link rel="stylesheet" href="css/ppt/ppt_vditor.css">
    <link rel="stylesheet" href="css/ppt/ppt_model_config_modal.css">
    <link rel="stylesheet" href="css/ppt/ppt_model_config.css">
    <link rel="stylesheet" href="css/ppt/modern-research-view.css">

    <style>
        /* 独立页面样式 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        #pptGeneratorOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top right, rgba(79, 70, 229, 0.05), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(124, 58, 237, 0.05), transparent 40%);
        }

        /* 极简精致滚动条 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        /* 增强背景质感 */
        .ocean-gradient-bg {
            background: #f8fafc;
            position: relative;
        }
        .ocean-gradient-bg::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100vh;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.8) 0%, rgba(248, 250, 252, 0) 100%);
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="ocean-gradient-bg">
    <!-- PPT Generator Overlay -->
    <div id="pptGeneratorOverlay">
        <!-- 由 JS 动态生成内容 -->
    </div>

    <!-- PPT 模块 (ESM 统一入口) -->
    <script type="module">
      import * as PPT from './js/ppt/index.js';
      // 暴露到全局
      window.PPT = PPT;
      window.SlideStyles = PPT.Core?.SlideStyles || window.SlideStyles;
      window.SlideParser = PPT.Core?.SlideParser || window.SlideParser;
      window.SlideSystem = PPT.Core?.SlideSystem || window.SlideSystem;
      window.HTMLSlideRenderer = PPT.Renderers?.HTMLSlideRenderer || window.HTMLSlideRenderer;
      window.PPTXSlideRenderer = PPT.Renderers?.PPTXSlideRenderer || window.PPTXSlideRenderer;
      window.MathConverter = PPT.Core?.MathConverter || window.MathConverter;
      window.PPTHealthCheck = PPT.Core?.PPTHealthCheck || window.PPTHealthCheck;
      window.PPTDashboard = PPT.Dashboard?.PPTDashboard || window.PPTDashboard;

      // PPTGenerator 需要通过 ensurePptGenerator() 创建实例
      try {
        if (PPT.Generator?.ensurePptGenerator) {
          window.PPTGenerator = PPT.Generator.ensurePptGenerator();
        }
      } catch (e) {
        console.error('[PPT] Failed to create PPTGenerator:', e);
      }

      console.log('[PPT] ESM modules loaded');
    </script>

    <!-- Editor 模块 -->
    <script type="module">
      import * as PPTEditor from './js/ppt/editor/index.js';
      window.PPTEditor = PPTEditor;
      window.SlideEditor = PPTEditor.SlideEditor;
      window.SlideDocument = PPTEditor.SlideDocument;
      window.HistoryManager = PPTEditor.HistoryManager;
      window.SelectionManager = PPTEditor.SelectionManager;
      window.TransformController = PPTEditor.TransformController;
      window.EventEmitter = PPTEditor.EventEmitter;
      window.PropertyPanel = PPTEditor.PropertyPanel;
      window.LayerPanel = PPTEditor.LayerPanel;
      console.log('[PPT] Editor ESM modules loaded');
    </script>

    <!-- 核心存储模块 -->
    <script type="module" src="js/storage/storage.js"></script>
    <!-- UI 模型管理核心 -->
    <script type="module" src="js/ui/ui_model_manager_core.js"></script>
    <script type="module" src="js/api/ai-api-service.js"></script>
    <!-- AI 生图适配器 -->
    <script type="module" src="js/process/image-generation.js"></script>
    <!-- PDF OCR 解析 -->
    <script type="module" src="js/process/ocr-manager.js"></script>

    <script type="module">
        // 独立页面初始化 (ESM 模块加载后执行)
        async function initPPT() {
            // 等待全局变量就绪
            let retries = 0;
            while (!window.PPTGenerator && retries < 50) {
                await new Promise(r => setTimeout(r, 100));
                retries++;
            }

            // 初始化 PPTGenerator（绑定 DOM 元素）
            if (window.PPTGenerator && typeof window.PPTGenerator.init === 'function') {
                window.PPTGenerator.init();
            }

            // 启动健康检查
            if (window.PPTHealthCheck) {
                await window.PPTHealthCheck.checkAndShow();
            }

            // 显示 PPT Generator
            if (window.PPTGenerator && window.PPTGenerator.show) {
                window.PPTGenerator.show();
            } else {
                console.error('PPTGenerator not loaded after 5s');
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPPT);
        } else {
            initPPT();
        }
    </script>
</body>
</html>
