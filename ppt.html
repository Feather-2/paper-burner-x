<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto PPT - Paper Burner X</title>
    <link rel="icon" type="image/svg+xml" href="public/pure.svg">

    <!-- CDN 预连接 -->
    <link rel="dns-prefetch" href="https://gcore.jsdelivr.net">
    <link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin>

    <!-- Vditor WYSIWYG Markdown Editor -->
    <link rel="stylesheet" href="https://gcore.jsdelivr.net/npm/vditor@3.10.7/dist/index.css" />
    <script src="https://gcore.jsdelivr.net/npm/vditor@3.10.7/dist/index.min.js"></script>

    <!-- Tailwind CSS & 核心依赖 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://gcore.jsdelivr.net/npm/iconify-icon@2.0.0/dist/iconify-icon.min.js"></script>
    <script src="https://gcore.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://gcore.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://gcore.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <!-- Document Parsing (DOCX/HTML) -->
    <script src="https://gcore.jsdelivr.net/npm/mammoth@1.4.21/mammoth.browser.min.js"></script>
    <script src="https://gcore.jsdelivr.net/npm/turndown@7.1.2/dist/turndown.min.js"></script>

    <!-- PptxGenJS -->
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://gcore.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://gcore.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Marked -->
    <script src="https://gcore.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- html2canvas (用于截图) -->
    <script src="https://gcore.jsdelivr.net/npm/html2canvas-pro@1.5.13/dist/html2canvas-pro.min.js"></script>

    <!-- React Flow (DeepSearch/Design 流程可视化) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.7.4/dist/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- PPT 样式模块 -->
    <link rel="stylesheet" href="css/ppt/ppt_generation_variables.css">
    <link rel="stylesheet" href="css/ppt/ppt_generation_layout.css">
    <link rel="stylesheet" href="css/ppt/ppt_generation_components.css">
    <link rel="stylesheet" href="css/ppt/ppt_generation_chat.css">
    <link rel="stylesheet" href="css/ppt/ppt_generation_presentation.css">
    <link rel="stylesheet" href="css/ppt/ppt_generation.css">
    <link rel="stylesheet" href="css/slide-editor.css">
    <link rel="stylesheet" href="css/ppt/ppt_vditor.css">
    <link rel="stylesheet" href="css/ppt/ppt_model_config_modal.css">
    <link rel="stylesheet" href="css/ppt/modern-research-view.css">

    <style>
        /* 独立页面样式 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        #pptGeneratorOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top right, rgba(79, 70, 229, 0.05), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(124, 58, 237, 0.05), transparent 40%);
        }

        /* 极简精致滚动条 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        /* 增强背景质感 */
        .ocean-gradient-bg {
            background: #f8fafc;
            position: relative;
        }
        .ocean-gradient-bg::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100vh;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.8) 0%, rgba(248, 250, 252, 0) 100%);
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="ocean-gradient-bg">
    <!-- PPT Generator Overlay -->
    <div id="pptGeneratorOverlay">
        <!-- 由 JS 动态生成内容 -->
    </div>

    <!-- PPT JS 模块 -->
    <script src="js/ppt/core/slide-styles.js"></script>
    <script src="js/ppt/core/health-check.js"></script>
    <script src="js/ppt/core/slide-parser.js"></script>
    <script src="js/ppt/core/slide-parser-pptx.js"></script>
    <script src="js/ppt/renderers/slide-renderer-html.js"></script>
    <script src="js/ppt/core/math-converter.js"></script>
    
    <!-- PPTX Renderer -->
    <script src="js/ppt/renderers/slide-renderer-pptx-freeform.js"></script>
    <script src="js/ppt/renderers/slide-renderer-pptx.js"></script>
    
    <script src="js/ppt/core/slide-system.js"></script>
    <script src="js/ppt/data/ppt_generator.sample.js"></script>
    <script src="js/ppt/data/ppt_landing_sample.js"></script>
    <script src="js/ppt/generator/ppt_generator_core.js"></script>
    <script src="js/ppt/generator/ppt_generator_navigation.js"></script>
    <script src="js/ppt/dashboard/vditor_adapter.js"></script>
    <script src="js/ppt/dashboard/report-review-panel.js"></script>
    <script src="js/ppt/dashboard/ppt_ui_flow_config.js"></script>
    <script src="js/ppt/dashboard/ppt_dashboard_utils.js"></script>
    <script src="js/ppt/dashboard/ppt_dashboard_upload.js"></script>
    <script src="js/ppt/dashboard/ppt_dashboard_history.js"></script>
    <script src="js/ppt/dashboard/ppt_dashboard_url_input.js"></script>
    <script src="js/ppt/dashboard/ppt_dashboard_paste.js"></script>
    <script src="js/ppt/dashboard/ppt_dashboard_modals.js"></script>
    <script src="js/ppt/dashboard/ppt_dashboard_deepsearch.js"></script>
    <script src="js/ppt/dashboard/ppt_dashboard_page_layout.js"></script>
    <script src="js/ppt/dashboard/ppt_dashboard_design_spec.js"></script>
    <script src="js/ppt/dashboard/ppt_dashboard_outline.js"></script>
    <script src="js/ppt/dashboard/ppt_dashboard_core.js"></script>
    <script src="js/ppt/generator/ppt_generator_workflow.js"></script>
    <script src="js/ppt/generator/ppt_generator_presentation.js"></script>
    <script src="js/ppt/generator/ppt_generator_utilities.js"></script>
    <script src="js/ppt/generator/ppt_generator_deletion.js"></script>
    
    <!-- Export 模块（按依赖顺序加载） -->
    <script src="js/ppt/generator/export/ppt_generator_export_image.js"></script>
    <script src="js/ppt/generator/export/ppt_generator_export_baking.js"></script>
    <script src="js/ppt/generator/export/ppt_generator_export_formats.js"></script>
    <script src="js/ppt/generator/export/ppt_generator_export_core.js"></script>
    
    <!-- Editor 模块（按依赖顺序加载） -->
    <script src="js/ppt/editor/event-emitter.js"></script>
    <script src="js/ppt/editor/storage-manager.js"></script>
    <script src="js/ppt/editor/document.js"></script>
    <script src="js/ppt/editor/history-manager.js"></script>
    <script src="js/ppt/editor/selection-manager.js"></script>
    <script src="js/ppt/editor/transform-controller.js"></script>
    <script src="js/ppt/editor/task-queue.js"></script>
    <script src="js/ppt/editor/slide-editor.js"></script>
    <script src="js/ppt/editor/panels/property-panel.js"></script>
    <script src="js/ppt/editor/panels/layer-panel.js"></script>
    
    <script src="js/ppt/generator/ppt_generation.js"></script>
    <script src="js/ppt/storage/ppt_storage.js"></script>
    
    <!-- 核心存储模块（提供 loadModelKeys, loadAllCustomSourceSites 等） -->
    <script src="js/storage/storage.js"></script>
    <!-- UI 模型管理核心（提供 supportedModelsForKeyManager） -->
    <script src="js/ui/ui_model_manager_core.js"></script>
    <script src="js/api/ai-api-service.js"></script>
    <!-- AI 生图适配器 -->
    <script src="js/process/image-generation.js"></script>
    <!-- PDF OCR 解析 -->
    <script src="js/process/ocr-manager.js"></script>
    <script src="js/ppt/model-config/ppt_model_config_constants.js"></script>
    <script src="js/ppt/model-config/ppt_model_config_utils.js"></script>
    <script src="js/ppt/model-config/ppt_model_config_styles.js"></script>
    <script src="js/ppt/model-config/ppt_model_config_sources.js"></script>
    <script src="js/ppt/model-config/ppt_model_config_roles.js"></script>
    <script src="js/ppt/model-config/ppt_model_config_tabs.js"></script>
    <script src="js/ppt/model-config/ppt_model_config_table.js"></script>
    <script src="js/ppt/model-config/ppt_model_config_advanced.js"></script>
    <script src="js/ppt/model-config/ppt_model_config_core.js"></script>
    
    <!-- 编辑器集成（必须在 ppt_generation.js 之后） -->
    <script src="js/ppt/generator/ppt_generator_editor.js"></script>

    <script>
        // 独立页面初始化
        document.addEventListener('DOMContentLoaded', async () => {
            // 启动健康检查
            if (window.PPTHealthCheck) {
                await window.PPTHealthCheck.checkAndShow();
            }

            // 等待 ppt_generation.js 初始化完成
            setTimeout(() => {
                if (window.PPTGenerator && window.PPTGenerator.show) {
                    // 直接显示项目列表
                    window.PPTGenerator.show();
                } else {
                    console.error('PPTGenerator not loaded');
                }
            }, 100);
        });
    </script>
</body>
</html>
